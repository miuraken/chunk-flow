[project]
name = "chunkflow-transcriber"
version = "0.1.0"
description = "Chunk Flow の PC 用文字起こしツール（chunkflow-transcript v1 の JSON を作る）"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # エンジン（環境ごとの条件付き依存。§7.4.4）
    # mlx-whisper は内部 API（mlx_whisper.decoding.detect_language）を使うため完全に固定する。
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper==1.2.1; sys_platform == 'linux'",
    # VAD: Silero VAD v6 の ONNX を両環境で同じ実装（onnxruntime）で動かす。
    # モデルは silero-vad 6.2.3 の wheel からハッシュを確かめて取り出す（vad.py）。
    "onnxruntime>=1.20,<2",
    # 中国語・広東語の字体の変換
    "opencc==1.4.2",
    # 出力の検証
    "jsonschema>=4.26,<5",
    # 推移的に必ず入るが直接 import するもの
    "numpy>=1.26",
    "huggingface-hub>=0.21",
]

[project.scripts]
chunkflow-transcribe = "chunkflow_transcriber.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff==0.15.0",  # この Mac の実行許可（Santa）で動く版に固定。上げるときは許可を確かめる
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10"]
build-backend = "uv_build"

[tool.uv]
# 1 つの uv.lock で macOS（Apple Silicon）と Linux に対応する（Windows は WSL2 の Linux）。
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 日本語のコメント・文字列で全角の記号を使うため
# E501: 行の長さは ruff format に任せる（日本語のコメントや文字列は全角の幅で数えられるため）
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: 実際の Whisper のモデルを使う（手元でのみ実行。CI では実行しない）",
]
addopts = "-m 'not model'"
