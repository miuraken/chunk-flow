# Chunk Flow の CI（設計書 §9、AGENTS.md §11）。
# ローカルで同じ確認をするコマンドは各ステップのコメントを参照。
# アクションはコミットの SHA で固定する（末尾のコメントが版。2026-10-14 に各リポジトリの最新の安定版のタグから取得。
# 注釈付きタグはタグが指すコミットの SHA）。更新するときは `git ls-remote --tags https://github.com/<owner>/<repo>.git` で確かめる。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ADR 0001: Gradle を動かす JDK（ローカルの Android Studio の JBR と同じメジャーバージョン）
  JAVA_VERSION: "25"

jobs:
  android:
    name: Android（spotless / lint / 単体テスト / assemble / マニフェスト）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # gradle-wrapper.jar のチェックサムを検証する（validate-wrappers）
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
      # ローカル: ./gradlew spotlessCheck lint testDebugUnitTest assembleDebug
      - name: spotlessCheck lint testDebugUnitTest assembleDebug
        run: ./gradlew --console=plain spotlessCheck lint testDebugUnitTest assembleDebug
      # ローカル: ./gradlew :app:processDebugMainManifest :app:processReleaseMainManifest && python3 .github/scripts/check_manifest.py
      - name: マージ後のマニフェストの権限とエクスポートの確認（§8.2）
        run: |
          ./gradlew --console=plain :app:processDebugMainManifest :app:processReleaseMainManifest
          python3 .github/scripts/check_manifest.py
      - name: レポートを保存
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  screenshot:
    # 基準画像は Apple Silicon の macOS で作るため、同じ環境で比較する（ADR 0002）
    name: スクリーンショットテスト（validateDebugScreenshotTest）
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
      # ローカル: ./gradlew validateDebugScreenshotTest
      - name: validateDebugScreenshotTest
        run: ./gradlew --console=plain validateDebugScreenshotTest
      - name: 差分のレポートを保存
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-reports
          path: "**/build/reports/screenshotTest/"
          retention-days: 7

  format:
    name: 文字起こしの形式（JSON Schema とサンプル）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # ローカル: uv run --no-project --with jsonschema python .github/scripts/validate_transcript_examples.py
      - name: サンプルの検証
        run: uv run --no-project --python 3.12 --with jsonschema python .github/scripts/validate_transcript_examples.py

