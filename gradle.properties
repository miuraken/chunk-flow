# Gradle（ADR 0001: Gradle は JDK 17 以上で動かす。ローカルは Android Studio の JBR、CI は Temurin）
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# Compose Preview Screenshot Testing（ADR 0002）。モジュール側の experimentalProperties と両方が必要
android.experimental.enableScreenshotTest=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Kotlin
kotlin.code.style=official
